<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Enterprise Workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ms-blue: #0078D4;
      --ms-blue-hover: #005A9E;
      --ms-blue-dark: #005A9E;
      --ms-blue-soft: rgba(0, 120, 212, 0.1);
      --ms-blue-glow: rgba(0, 120, 212, 0.25);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-acrylic: rgba(255, 255, 255, 0.82);
      --bg-sidebar: rgba(255, 255, 255, 0.72);
      --bg-header: rgba(255, 255, 255, 0.68);
      --card-acrylic: rgba(255, 255, 255, 0.86);
      --border-light: rgba(255, 255, 255, 0.95);
      --border-subtle: rgba(15, 23, 42, 0.07);
      --error-text: #D13438;
      --error-bg: #FDE7E9;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background-color: #f1f5f9; color: var(--text-main);
      -webkit-font-smoothing: antialiased; overflow: hidden;
    }

    body.dashboard-mode {
      display: flex; align-items: stretch; justify-content: flex-start;
      overflow-x: hidden; overflow-y: auto; background-color: #f1f5f9;
    }

    .ambient-bg {
      position: fixed; inset: 0; z-index: -2; overflow: hidden;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f0f9ff 100%);
    }

    .grid-overlay {
      position: fixed; inset: 0; z-index: -1;
      background-image: linear-gradient(to right, rgba(15, 23, 42, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(15, 23, 42, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    }

    body.dashboard-mode .grid-overlay {
      background-size: 36px 36px; mask-image: none; -webkit-mask-image: none;
    }

    .orb {
      position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.55;
      animation: float 22s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .orb-1 { width: 48vw; height: 48vw; background: #93c5fd; top: -12%; left: -10%; }
    .orb-2 { width: 55vw; height: 55vw; background: #c4b5fd; bottom: -18%; right: -10%; animation-delay: -5s; }
    .orb-3 { width: 38vw; height: 38vw; background: #67e8f9; top: 35%; left: 28%; animation-delay: -10s; opacity: 0.4; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(4%, 8%) scale(1.08); }
    }

    /* AUTH */
    .auth-wrapper {
      width: 100%; max-width: 440px; padding: 20px;
      animation: scaleFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(16px) scale(0.98);
    }
    @keyframes scaleFadeIn { to { opacity: 1; transform: translateY(0) scale(1); } }
    .auth-container {
      background: var(--bg-acrylic); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
      border: 1px solid var(--border-light); border-radius: 16px; padding: 44px 40px 36px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.03), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
    }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .brand-row { display: flex; align-items: center; gap: 12px; }
    .logo-container { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5px; width: 28px; height: 28px; flex-shrink: 0; }
    .logo-square { background: var(--ms-blue); border-radius: 2px; }
    .brand-name { font-weight: 700; font-size: 0.95rem; color: var(--text-main); }
    .security-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 999px; font-size: 0.7rem; font-weight: 600; color: #059669;
    }
    .security-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; }
    .auth-header h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 6px 0; }
    .auth-header p { color: var(--text-muted); margin: 0 0 28px 0; font-size: 0.9rem; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.78rem; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 14px; color: #94a3b8; pointer-events: none; }
    .form-control {
      width: 100%; background: rgba(255, 255, 255, 0.85); border: 1px solid #cbd5e1;
      border-radius: 8px; color: var(--text-main); padding: 11px 14px 11px 40px; font-size: 0.92rem; font-family: inherit;
    }
    .form-control:focus { outline: none; border-color: var(--ms-blue); background: #ffffff; box-shadow: 0 0 0 3px var(--ms-blue-glow); }
    .meta-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 22px; font-size: 0.8rem; color: var(--text-muted); }
    .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .btn-submit {
      width: 100%; background: linear-gradient(180deg, #0078D4 0%, #006CBE 100%); color: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08); padding: 12px 16px; border-radius: 8px; font-size: 0.92rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(0, 120, 212, 0.25);
    }
    .error-msg {
      background: var(--error-bg); color: var(--error-text); padding: 12px 14px; border-radius: 8px;
      font-size: 0.82rem; font-weight: 500; margin-bottom: 20px; display: none; align-items: center; gap: 10px;
    }
    .auth-footer {
      margin-top: 28px; padding-top: 18px; border-top: 1px solid rgba(15, 23, 42, 0.06);
      display: flex; align-items: center; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #94a3b8;
    }

    /* DASHBOARD */
    #app-root { display: none; width: 100%; min-height: 100vh; }
    .sidebar {
      width: 260px; min-height: 100vh; background: var(--bg-sidebar); backdrop-filter: blur(36px);
      border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; padding: 24px 16px; position: sticky; top: 0; height: 100vh; z-index: 20; flex-shrink: 0;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 4px 12px 24px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 20px; }
    .brand-title { display: flex; flex-direction: column; }
    .brand-title strong { font-size: 1rem; font-weight: 700; color: var(--text-main); }
    .brand-title span { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }
    .nav-group { margin-bottom: 24px; }
    .nav-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; padding: 0 12px; margin-bottom: 8px; }
    .nav-list { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
      border-radius: 8px; font-size: 0.86rem; font-weight: 500; color: #475569; cursor: pointer; transition: all 0.18s ease;
    }
    .nav-item-left { display: flex; align-items: center; gap: 10px; }
    .nav-item:hover { background: rgba(0, 120, 212, 0.06); color: var(--text-main); }
    .nav-item.active { background: var(--ms-blue); color: #ffffff; font-weight: 600; box-shadow: 0 4px 12px rgba(0, 120, 212, 0.22); }
    .nav-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; padding: 2px 6px; border-radius: 6px; background: rgba(15, 23, 42, 0.06); color: #475569; font-weight: 600; }
    .nav-item.active .nav-badge { background: rgba(255, 255, 255, 0.22); color: #ffffff; }

    .sidebar-telemetry {
      margin-top: auto; background: rgba(255, 255, 255, 0.75); border: 1px solid var(--border-subtle);
      border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .telemetry-head { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; font-weight: 600; }
    .status-dot-green { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
    .progress-section { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; padding-top: 8px; border-top: 1px solid rgba(15, 23, 42, 0.06); }
    .progress-header { display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 600; }
    .progress-bar { width: 100%; height: 5px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .progress-fill { width: 88%; height: 100%; background: linear-gradient(90deg, #10b981, #34d399); border-radius: 999px; }
    .telemetry-meta { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--text-muted); }

    .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 68px; background: var(--bg-header); backdrop-filter: blur(32px); border-bottom: 1px solid var(--border-subtle);
      padding: 0 36px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 15;
    }
    .breadcrumbs { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
    .breadcrumbs strong { color: var(--text-main); font-weight: 600; }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
      background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.22); border-radius: 999px; font-size: 0.75rem; font-weight: 600; color: #059669;
    }
    .operator-avatar {
      width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #0078D4, #005A9E);
      color: #fff; font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .content { max-width: 1220px; width: 100%; margin: 0 auto; padding: 36px 36px 48px; flex: 1; }
    .page-hero { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border-subtle); }
    .page-hero h1 { font-size: 1.55rem; font-weight: 700; margin: 0 0 6px 0; }
    .page-hero p { margin: 0; font-size: 0.9rem; color: var(--text-muted); }
    .hero-stats { display: flex; gap: 24px; }
    .stat-item { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 600; }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 600; }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-title { display: flex; align-items: center; gap: 10px; font-size: 0.92rem; font-weight: 700; color: var(--text-main); }
    .section-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; padding: 2px 8px; border-radius: 999px; background: rgba(0, 120, 212, 0.1); color: var(--ms-blue); font-weight: 600; }
    .section-hint { font-size: 0.76rem; color: var(--text-muted); }

    .grid-top-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-bottom: 40px; }
    .grid-bottom-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 32px; }

    .card {
      background: var(--card-acrylic); backdrop-filter: blur(24px); border: 1px solid var(--border-light);
      border-radius: 14px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 4px 14px rgba(15, 23, 42, 0.03); position: relative; overflow: hidden; user-select: none;
    }
    .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--ms-blue), #38bdf8); opacity: 0; transition: opacity 0.2s ease; }
    .card:hover { transform: translateY(-3px); background: #ffffff; border-color: rgba(0, 120, 212, 0.28); box-shadow: 0 14px 32px rgba(15, 23, 42, 0.07); }
    .card:hover::before { opacity: 1; }
    .card.loading { cursor: wait; background: #f0f7ff; border-color: rgba(0, 120, 212, 0.4); }

    .card-primary { padding: 26px 28px; gap: 18px; }
    .card-top-row { display: flex; align-items: center; justify-content: space-between; }
    .icon-box { width: 46px; height: 46px; border-radius: 10px; background: var(--ms-blue-soft); display: flex; align-items: center; justify-content: center; color: var(--ms-blue); transition: all 0.2s ease; }
    .card:hover .icon-box { background: var(--ms-blue); color: #ffffff; box-shadow: 0 6px 14px rgba(0, 120, 212, 0.28); }
    .card-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; font-weight: 600; padding: 4px 10px; border-radius: 6px; background: rgba(15, 23, 42, 0.04); color: #475569; border: 1px solid rgba(15, 23, 42, 0.06); }
    .card-content { display: flex; flex-direction: column; gap: 6px; }
    .card-primary .card-title { font-weight: 700; font-size: 1.12rem; color: var(--text-main); }
    .card-primary .card-desc { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; }
    .card-footer-meta { padding-top: 14px; border-top: 1px solid rgba(15, 23, 42, 0.06); display: flex; align-items: center; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: #64748b; }
    .action-label { color: var(--ms-blue); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

    .card-compact { padding: 18px 18px 16px; gap: 12px; border-radius: 12px; }
    .card-compact .icon-box { width: 36px; height: 36px; border-radius: 8px; }
    .card-compact .card-title { font-weight: 600; font-size: 0.94rem; color: var(--text-main); }
    .card-compact .card-desc { font-size: 0.78rem; color: var(--text-muted); }
    .card-compact .card-footer-meta { padding-top: 10px; font-size: 0.66rem; }

    .spinner { width: 20px; height: 20px; border: 2.2px solid transparent; border-top-color: #ffffff; border-right-color: #ffffff; border-radius: 50%; animation: spin 0.75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px);
      color: #ffffff; padding: 12px 18px; border-radius: 10px; font-size: 0.82rem; font-weight: 500;
      display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.12); transform: translateY(80px); opacity: 0; transition: all 0.28s ease; z-index: 100; pointer-events: none;
    }
    .toast.visible { transform: translateY(0); opacity: 1; }
    .footer { text-align: center; padding: 20px 36px; color: #94a3b8; font-size: 0.74rem; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="ambient-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="grid-overlay"></div>

  <div class="auth-wrapper" id="login-screen">
    <div class="auth-container">
      <div class="top-bar">
        <div class="brand-row">
          <div class="logo-container"><div class="logo-square"></div><div class="logo-square"></div><div class="logo-square"></div><div class="logo-square"></div></div>

        <div class="security-pill"><span class="security-dot"></span>TLS 1.3 SSO</div>

      <div class="auth-header">

      <form id="auth-form">
        <div class="form-group">
          <label class="form-label">Operator ID / Username</label>
          <div class="input-wrap"><input type="text" id="username" class="form-control" placeholder="Enter operator username" required autocomplete="off"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Security Token</label>
          <div class="input-wrap"><input type="password" id="password" class="form-control" placeholder="••••••••••••" required></div>
        </div>
        <button type="submit" class="btn-submit"><span>Authorize Session</span></button>
      </form>
    </div>
  </div>

  <div id="app-root"></div>

      if (!ENCRYPTED_VAULT) {
        const payload = JSON.stringify({ html: DASHBOARD_TEMPLATE, cmds: SETUP_COMMANDS });
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(user, pass, salt);
        const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(payload));
        const b64 = btoa(JSON.stringify({ s: Array.from(salt), i: Array.from(iv), c: Array.from(new Uint8Array(cipher)) }));
        
        document.body.innerHTML = `
          <div style="background:#0b0f19; color:#fff; padding:40px; font-family:monospace; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
            <h2>ШИФР ГОТОВ!</h2>
            <p style="color:#94a3b8; margin-bottom:20px;">Нажми кнопку, чтобы забрать его в буфер:</p>
            <button onclick="navigator.clipboard.writeText('${b64}').then(()=>alert('Скопировано!'))" style="background:#0078D4; color:#fff; border:none; padding:15px 30px; font-size:16px; border-radius:8px; cursor:pointer; font-weight:bold; margin-bottom:20px;">СКОПИРОВАТЬ ШИФР</button>
            <textarea style="width:80%; height:120px; background:#000; color:#38bdf8; padding:10px; border-radius:8px;" readonly>${b64}</textarea>
          </div>`;
        return;
      }

      try {
        const raw = JSON.parse(atob(ENCRYPTED_VAULT));
        const key = await deriveKey(user, pass, new Uint8Array(raw.s));
        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(raw.i) }, key, new Uint8Array(raw.c));
        const data = JSON.parse(dec.decode(decrypted));
        launchDashboard(data.html, data.cmds);
      } catch (err) {
        errBox.style.display = "flex";
      }
    });

    function launchDashboard(html, COMMAND_MAP) {
      document.title = "Workspace | Operations Hub";
      document.getElementById("login-screen").remove();
      document.body.classList.add("dashboard-mode");
      const root = document.getElementById("app-root");
      root.style.display = "flex";
      root.innerHTML = html;

      async function handleCardClick(cardElement) {
        if (cardElement.classList.contains("loading")) return;
        const cmdKey = cardElement.getAttribute("data-cmd");
        const textToConnect = COMMAND_MAP[cmdKey];
        if (!textToConnect) return;

        cardElement.classList.add("loading");
        try { await navigator.clipboard.writeText(textToConnect); } catch (e) {}
        
        const toast = document.getElementById("copy-toast");
        toast.classList.add("visible");
        setTimeout(() => toast.classList.remove("visible"), 2600);
        setTimeout(() => cardElement.classList.remove("loading"), 1500);
      }

      document.querySelectorAll(".card[data-cmd]").forEach((card) => {
        card.addEventListener("click", () => handleCardClick(card));
      });
    }
  </script>
</body>
